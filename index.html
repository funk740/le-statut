<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Statut</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>LE STATUT</h1>
        <div class="header-buttons">
            <button id="contactBtn" class="action-btn" onclick="openContactModal()">CONTACT</button>
        </div>
    </header>
    
    <main>
        <div class="gallery">
            <figure>
                <img src="img/Affaire-pénale.jpg" alt="Affaire pénale" onclick="openImageModal(this)">
            </figure>
            <figure>
                <img src="img/Homme2.jpg" alt="Maître Zevenboom Jan" onclick="openImageModal(this)">
                <figcaption>MAÎTRE ZEVENBOOM JAN</figcaption>
            </figure>
            <figure>
                <img src="img/Moscow.jpg" alt="Moscou" onclick="openImageModal(this)">
                <figcaption>MOSCOU</figcaption>
            </figure>
            <figure>
                <img src="img/New-Conv.jpg" alt="Argument" onclick="openImageModal(this)">
                <figcaption>ARGUMENT</figcaption>
            </figure>
            <figure>
                <img src="img/Homme1.jpg" alt="Mr Koukchen Rachid" onclick="openImageModal(this)">
                <figcaption>MR KOUKCHEN RACHID</figcaption>
            </figure>
            <figure>
                <img src="img/Paysage.jpg" alt="Taipei" onclick="openImageModal(this)">
                <figcaption>TAIPEI</figcaption>
            </figure>
        </div>
    </main>

    <!-- Modal for image enlargement -->
    <div id="imageModal" class="modal" onclick="closeImageModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="expandedImg">
    </div>

    <!-- Modal for Contact Info -->
    <div id="contactModal" class="modal contact-modal-overlay" onclick="closeContactModal(event)">
        <div class="contact-card" onclick="event.stopPropagation()">
            <span class="close-contact" onclick="closeContactModal(event)">&times;</span>
            <h2>Informations de contact</h2>
            <p><strong>Téléphone :</strong> 00.33.6.09.52.01.82</p>
            <p><strong>E-mail :</strong> koukchen@hotmail.com</p>
        </div>
    </div>

    <script>
        function openImageModal(img) {
            var modal = document.getElementById("imageModal");
            var modalImg = document.getElementById("expandedImg");
            modal.style.display = "flex";
            modalImg.src = img.src;
        }

        function closeImageModal() {
            var modal = document.getElementById("imageModal");
            modal.style.display = "none";
        }

        function openContactModal() {
            var modal = document.getElementById("contactModal");
            modal.style.display = "flex";
        }

        function closeContactModal(event) {
            var modal = document.getElementById("contactModal");
            // If the event is provided, we can check where the click occurred, 
            // but for simplicity it closes when the overlay or the X is clicked.
            modal.style.display = "none";
        }
    </script>
</body>
</html>
